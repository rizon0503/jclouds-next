name: Live Tests (Integration with real cloud)

# Manual trigger only — live tests call real cloud APIs and cost money.
# Run against a specific provider by choosing from the dropdown.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider module to test'
        required: true
        type: choice
        options:
          - aws-s3
          - azureblob
          - google-cloud-storage
          - b2
          - rackspace-cloudfiles-uk
          - rackspace-cloudfiles-us

jobs:
  live:
    name: Live tests — ${{ inputs.provider }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Run live tests for ${{ inputs.provider }}
        # -Plive enables the surefire execution that includes *LiveTest.java
        # -pl builds only the chosen provider (and its transitive deps via -am)
        run: mvn test -Plive -pl providers/${{ inputs.provider }} -am -B -fae
        env:
          MAVEN_OPTS: -Xmx1g
          # AWS S3
          test.identity: ${{ secrets.AWS_ACCESS_KEY_ID }}
          test.credential: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          test.aws-s3.endpoint: ${{ secrets.AWS_S3_ENDPOINT }}       # optional
          # Azure Blob
          test.azureblob.identity: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          test.azureblob.credential: ${{ secrets.AZURE_STORAGE_KEY }}
          # Google Cloud Storage
          test.google-cloud-storage.identity: ${{ secrets.GCS_SERVICE_ACCOUNT_EMAIL }}
          test.google-cloud-storage.credential: ${{ secrets.GCS_PRIVATE_KEY }}
          # Backblaze B2
          test.b2.identity: ${{ secrets.B2_ACCOUNT_ID }}
          test.b2.credential: ${{ secrets.B2_APPLICATION_KEY }}
          # Rackspace Cloud Files
          test.rackspace-cloudfiles-uk.identity: ${{ secrets.RACKSPACE_USERNAME }}
          test.rackspace-cloudfiles-uk.credential: ${{ secrets.RACKSPACE_API_KEY }}
          test.rackspace-cloudfiles-us.identity: ${{ secrets.RACKSPACE_USERNAME }}
          test.rackspace-cloudfiles-us.credential: ${{ secrets.RACKSPACE_API_KEY }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-reports-${{ inputs.provider }}
          path: '**/target/surefire-reports/'
          retention-days: 14
